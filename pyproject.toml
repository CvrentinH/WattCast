[project]
name = "wattcast"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.96",
    "boto3-stubs[s3]>=1.43.114",
    "botocore>=1.43.96",
    "niquests>=3.21.1",
    "numpy>=2.5.3",
    "openmeteo-requests>=1.7.5",
    "pandas>=3.0.5",
    "polars>=1.44.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-json-logger>=4.2.0",
    "redis>=8.1.0",
    "retry-requests>=2.0.0",
    "sqlalchemy>=2.0.54",
    "ty>=0.0.89",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
exclude = [
    ".git",
    ".venv",
    "pycache",
]

[tool.ruff.lint]
extend-select = ["ANN"]

[tool.ruff.format]
indent-style = "tab"

[tool.ty.rules]
missing-type-argument = "error"
