services:
    minio:
        image: minio/minio:latest
        container_name: minio-wattcast
        ports:
            - "9000:9000"
            - "9001:9001"
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadminpassword
        volumes:
            - minio_data:/data
        command: server /data --console-address ":9001"
        restart: unless-stopped

    init-buckets:
        image: minio/mc:latest
        depends_on:
            - minio-wattcast
        entrypoint: >
            /bin/sh -c " until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadminpassword; do
              echo 'En attente du démarrage de MinIO...';
              sleep 1;
            done; /usr/bin/mc mb local/bucket-silver --ignore-existing; /usr/bin/mc mb local/bucket-bronze --ignore-existing; exit 0; "

    postgres:
        image: postgres/postgres:latest
        container_name: postgres-wattcast
        ports:
            - ""

volumes:
    minio_data:
